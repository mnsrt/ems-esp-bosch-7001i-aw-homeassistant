- id: 'hp_high_delta_t_alert'
  alias: "⚠️ Heat Pump High Delta T (Low Flow Proxy)"
  description: "Alerts if Delta T > 10°C while compressor is active"
  trigger:
    - platform: numeric_state
      entity_id: sensor.heating_loop_delta_t
      above: 10
      for:
        minutes: 5
  condition:
    - condition: numeric_state
      entity_id: sensor.boiler_hpcurrpower
      above: 200 # Compressor is definitely running
  action:
    - service: notify.notify
      data:
        title: "⚠️ Heat Pump Flow Warning"
        message: >
          Delta T is currently {{ states('sensor.heating_loop_delta_t') }}°C. 
          Flow may be restricted. Check the magnetic filter and system pressure.
    - service: persistent_notification.create
      data:
        title: "Efficiency Alert"
        message: "High Delta T detected. The Bosch 13kW efficiency (COP) drops as Delta T rises above 7°C."
  mode: single

- id: bosch_heat_carrier_delta_t_alert
  alias: "Bosch — High Delta-T Alert (flow vs return)"
  description: >
    Fires when forward_tc1 − return_tc0 exceeds 10 °C for 5 consecutive
    minutes. Sends persistent notification, mobile push, and logbook entry.
    1-hour cooldown prevents re-triggering during sustained faults.
  trigger:
    - platform: template
      value_template: >
        {% set fwd = states('sensor.bosch_heat_carrier_forward_tc1') | float(0) %}
        {% set ret = states('sensor.bosch_heat_carrier_return_tc0') | float(0) %}
        {{ (fwd - ret) > 10 }}
      for: "00:05:00"

  condition:
    - condition: template
      value_template: >
        {{ this.attributes.last_triggered is none or
           (now() - this.attributes.last_triggered).total_seconds() > 3600 }}

  action:
    - variables:
        fwd_temp: >
          {{ states('sensor.bosch_heat_carrier_forward_tc1') | float(0) | round(1) }}
        ret_temp: >
          {{ states('sensor.bosch_heat_carrier_return_tc0') | float(0) | round(1) }}
        delta: >
          {{ (states('sensor.bosch_heat_carrier_forward_tc1') | float(0) -
              states('sensor.bosch_heat_carrier_return_tc0') | float(0)) | round(1) }}

    - service: persistent_notification.create
      data:
        title: "⚠️ Heat Carrier Delta-T High"
        message: >
          Flow: {{ fwd_temp }} °C  |  Return: {{ ret_temp }} °C  |  Δ {{ delta }} °C
          (sustained > 5 min, threshold: 10 °C)

          This may indicate a hydraulic restriction — check zone valves,
          circulation pump output, or air in the heating circuit.
        notification_id: bosch_delta_t_alert

    - service: notify.notify
      data:
        title: "⚠️ Heat Carrier Delta-T High"
        message: >
          Flow {{ fwd_temp }} °C / Return {{ ret_temp }} °C — Δ {{ delta }} °C.
          Possible hydraulic restriction (>5 min sustained).
        data:
          tag: bosch_delta_t_alert
          channel: Heating Alerts

    - service: logbook.log
      data:
        name: "Bosch Heat Pump"
        message: >
          Delta-T alert: flow {{ fwd_temp }} °C, return {{ ret_temp }} °C,
          delta {{ delta }} °C — exceeded 10 °C for 5+ minutes.
        entity_id: sensor.bosch_heat_carrier_forward_tc1

  mode: single

- id: bosch_dhw_disinfection_pause_circulation
  alias: "Bosch DHW — Pause circulation when disinfection starts"
  description: >
    When switch.bosch_dhw_disinfecting turns on, snapshots the circulation
    pump state into a scene and turns the pump off.
  trigger:
    - platform: state
      entity_id: switch.bosch_dhw_disinfecting
      to: "on"

  action:
    - variables:
        circ_before: "{{ states('switch.bosch_dhw_circulation_active') }}"

    - service: scene.create
      data:
        scene_id: dhw_before_disinfection
        snapshot_entities:
          - switch.bosch_dhw_circulation_active

    - service: switch.turn_off
      target:
        entity_id: switch.bosch_dhw_circulation_active

    - service: logbook.log
      data:
        name: "Bosch DHW Disinfection"
        message: >
          Disinfection started. Circulation was {{ circ_before | upper }}
          before disinfection — turned off, state saved in scene for restore.
        entity_id: switch.bosch_dhw_disinfecting

  mode: single

- id: bosch_dhw_disinfection_restore_circulation
  alias: "Bosch DHW — Restore circulation after disinfection"
  description: >
    When switch.bosch_dhw_disinfecting turns off, restores the circulation
    pump to its pre-disinfection state via the saved scene.
  trigger:
    - platform: state
      entity_id: switch.bosch_dhw_disinfecting
      to: "off"

  condition:
    - condition: template
      value_template: >
        {{ states('scene.dhw_before_disinfection') not in ['unknown', 'unavailable', 'none'] }}

  action:
    - service: scene.turn_on
      target:
        entity_id: scene.dhw_before_disinfection

    - service: logbook.log
      data:
        name: "Bosch DHW Disinfection"
        message: "Disinfection complete. Circulation pump restored to pre-disinfection state."
        entity_id: switch.bosch_dhw_disinfecting

  mode: single

- id: vallox_cold_weather_speed
  alias: "Vallox — Cold Weather Speed Control"
  description: >
    Adjusts ventilation speed when outdoor temperature crosses -10°C or -15°C.
    62% (≥-10°C, normal), 47% (-10 to -15°C), 45% (<-15°C, hard floor).
    Sends notification when speed is reduced below 62% or restored to normal.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.bosch_outside_temperature
      above: -10
    - trigger: numeric_state
      entity_id: sensor.bosch_outside_temperature
      below: -10
    - trigger: numeric_state
      entity_id: sensor.bosch_outside_temperature
      above: -15
    - trigger: numeric_state
      entity_id: sensor.bosch_outside_temperature
      below: -15
  actions:
    - variables:
        outdoor_temp: "{{ states('sensor.bosch_outside_temperature') | float(99) }}"
        target_speed: >
          {% if outdoor_temp >= -10 %}62
          {% elif outdoor_temp >= -15 %}47
          {% else %}45{% endif %}
    - action: fan.set_percentage
      target:
        entity_id: fan.vallox
      data:
        percentage: "{{ target_speed | int }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ target_speed | int == 62 }}"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.vallox_cold_mode_active
            - action: notify.notify
              data:
                title: "✅ Vallox — Normal Ventilation Restored"
                message: >
                  Ventilation restored to 62%
                  (outdoor {{ outdoor_temp | round(1) }}°C).
      default:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.vallox_cold_mode_active
        - action: notify.notify
          data:
            title: "🌡️ Vallox — Cold Weather Mode"
            message: >
              Ventilation reduced to {{ target_speed }}%
              (outdoor {{ outdoor_temp | round(1) }}°C).
  mode: single

- id: vallox_air_quality_override
  alias: "Vallox — Air Quality Override"
  description: >
    Restores ventilation to 62% if CO2 exceeds 800 ppm or PM2.5 exceeds 25 μg/m³
    while outdoor temperature is below -10°C. numeric_state triggers are naturally
    guarded against unavailable sensor states.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.co2
      above: 800
    - trigger: numeric_state
      entity_id: sensor.pm2_5
      above: 25
  conditions:
    - condition: numeric_state
      entity_id: sensor.bosch_outside_temperature
      below: -10
  actions:
    - variables:
        outdoor_temp: "{{ states('sensor.bosch_outside_temperature') | float(0) | round(1) }}"
        co2_val: "{{ states('sensor.co2') }}"
        pm25_val: "{{ states('sensor.pm2_5') }}"
    - action: fan.set_percentage
      target:
        entity_id: fan.vallox
      data:
        percentage: 62
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.vallox_cold_mode_active
    - action: notify.notify
      data:
        title: "🌬️ Vallox — Air Quality Override"
        message: >
          Ventilation restored to 62% (outdoor {{ outdoor_temp }}°C).
          {% if trigger.entity_id == 'sensor.co2' %}
          CO2 at {{ co2_val }} ppm (threshold: 800 ppm).
          {% else %}
          PM2.5 at {{ pm25_val }} μg/m³ (threshold: 25 μg/m³).
          {% endif %}
  mode: single

- id: vallox_startup_profile_fix
  alias: "Vallox — Startup Profile Fix"
  description: >
    On HA restart, re-applies the correct ventilation speed based on current
    outdoor temperature. Fixes the Vallox bug where it reverts to Fireplace
    mode after restart (HA issue #100043). Does not send notifications.
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:00:10"
    - variables:
        outdoor_temp: "{{ states('sensor.bosch_outside_temperature') | float(99) }}"
        target_speed: >
          {% if outdoor_temp >= -10 %}62
          {% elif outdoor_temp >= -15 %}47
          {% else %}45{% endif %}
    - action: fan.set_percentage
      target:
        entity_id: fan.vallox
      data:
        percentage: "{{ target_speed | int }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ outdoor_temp < -10 }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.vallox_cold_mode_active
      default:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.vallox_cold_mode_active
  mode: single

- id: 'reset_monthly_cost_adjustments'
  alias: 'Reset monthly cost adjustment helpers on 1st of each month'
  description: >
    The input_number adjustments are one-time calibrations (e.g. for a partial
    first month). They must be zeroed when the monthly utility meters reset,
    otherwise the corrected sensors carry stale offsets into the new month.
  triggers:
  - trigger: time
    at: '00:00:01'
  conditions:
  - condition: template
    value_template: "{{ now().day == 1 }}"
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.monthly_fixed_tariff_cost_adjustment
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.monthly_energy_cost_market_adjustment
    data:
      value: 0
  mode: single